server {
    listen 80;

    # Resolve "app" through Docker's embedded DNS on every request (cached 5s)
    # instead of once at startup. A recreated app container (new IP) is picked
    # up automatically, and the proxy starts even while the app is down.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $upstream http://app:8000;

    location / {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Short upstream timeouts so a dead app surfaces as a fast 502/504, not a
        # multi-second hang on Nginx's 60s connect-timeout default.
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
}
