name: Docker Image

# Every push/PR builds and validates the CloudPulse CLI image locally (no push:
# this is a smoke test, not a release). Only a `v*.*.*` tag push on this repo
# (not a fork) publishes it to GHCR, and only after the repository owner has
# enabled package-write permissions -- see DEPLOYMENT.md.
on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cloudpulse:ci
      - name: Validate image runs and is non-root
        run: |
          docker run --rm cloudpulse:ci --help
          uid="$(docker run --rm --entrypoint id cloudpulse:ci -u)"
          echo "Container UID: $uid"
          if [ "$uid" = "0" ]; then
            echo "Image must not run as root" >&2
            exit 1
          fi

  publish:
    if: github.repository_owner == 'udayramageri09' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}:latest
