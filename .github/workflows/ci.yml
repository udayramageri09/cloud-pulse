name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: CLI smoke check
        run: |
          cloudpulse --help
          cloudpulse --format json --output report.json || true
          python -c "import json; report = json.load(open('report.json')); assert 'incident_id' in report and 'checks' in report and report['checks'], report; print('CLI produced a well-formed incident report:', report['overall_status'])"
