services:
  app:
    build: ./simulation/app
    environment:
      APP_MODE: "${APP_MODE:-healthy}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./simulation/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
