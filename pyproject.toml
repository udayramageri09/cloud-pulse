[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudpulse-diagnostics"
version = "0.2.0"
description = "A small Linux and network diagnostics CLI for incident triage"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
cloudpulse = "cloudpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is handled by `ruff format`

[tool.ruff.lint.isort]
known-first-party = ["cloudpulse"]
