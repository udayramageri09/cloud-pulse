[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudpulse-diagnostics"
version = "0.1.0"
description = "A small Linux and network diagnostics CLI for incident triage"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
cloudpulse = "cloudpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
